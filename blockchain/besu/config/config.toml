# WolverineDB Hyperledger Besu Validator Node Configuration
genesis-file="/opt/besu/genesis.json"
data-path="/opt/besu/data"

# P2P Networking
p2p-enabled=true
p2p-host="0.0.0.0"
discovery-enabled=true

# JSON-RPC HTTP Configuration
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8545
rpc-http-api=["ETH", "NET", "WEB3", "QBFT", "PERM", "TXPOOL"]
rpc-http-cors-origins=["*"]

# Engine / WebSockets API
rpc-ws-enabled=true
rpc-ws-host="0.0.0.0"
rpc-ws-port=8546
rpc-ws-api=["ETH", "NET", "WEB3", "QBFT"]

# Gas Model
min-gas-price=0

# Metrics & Observability
metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9545

# Logging
logging="INFO"
